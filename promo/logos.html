<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>agenthop logo 方案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@500;600;700&family=Outfit:wght@500;600;700&display=block" rel="stylesheet">
<style>
:root{--sans:"PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#1a1d24;font-family:var(--sans);color:#e8ecf3;padding:28px;width:1680px}
.dark{--fg:#EEF2F8;--a:#5EEAD4;--b:#A78BFA;--bg:#0B0F16;--muted:#8b95a8}
.light{--fg:#111827;--a:#0D9488;--b:#7C3AED;--bg:#F5F7FA;--muted:#6b7280}
.row{display:grid;grid-template-columns:230px 190px 470px 470px 250px;gap:14px;align-items:stretch;margin-bottom:14px}
.cell{border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:18px;padding:18px;min-height:170px}
.name{display:flex;flex-direction:column;justify-content:center;padding:0 6px}
.name b{font-size:26px}.name span{font-size:15px;color:#9aa3b5;margin-top:8px;line-height:1.5}
.tile{width:132px;height:132px;border-radius:30px;background:#0B0F16;display:grid;place-items:center;border:1px solid rgba(255,255,255,.08)}
.word{font-family:"Manrope";font-weight:700;font-size:54px;letter-spacing:-1.6px;color:var(--fg);line-height:1}
.word i{font-style:normal;color:var(--a)}
.small{flex-wrap:wrap;gap:14px}
</style>
</head>
<body>
<div id="rows"></div>
<script>
let uid = 0;
const grad = (id, dir = 'x1="0" x2="1"') => `<linearGradient id="g${id}" ${dir}><stop offset="0" style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--b)"/></linearGradient>`;
const MARKS = {
  bridgeH: {
    name: "A 双塔桥", note: "两座塔是两台电脑，<br>中间一道拱桥直接连通；也是 hop 的 H",
    svg: (id) => `<defs>${grad(id)}</defs>
      <path d="M20 45 C20 17.5, 44 17.5, 44 45" fill="none" stroke="url(#g${id})" stroke-width="9"/>
      <rect x="9" y="9" width="12" height="46" rx="6" style="fill:var(--fg)"/>
      <rect x="43" y="9" width="12" height="46" rx="6" style="fill:var(--fg)"/>`,
  },
  brackets: {
    name: "B 括号对话", note: "一对代码括号是两个 agent，<br>中间“正在输入”的三个点连成一跳",
    svg: (id) => `<path d="M21 16 L8 32 L21 48" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--a)"/>
      <path d="M43 16 L56 32 L43 48" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--b)"/>
      <circle cx="23.8" cy="35" r="3.5" style="fill:var(--fg)"/><circle cx="32" cy="27.5" r="4.9" style="fill:var(--fg)"/><circle cx="40.2" cy="35" r="3.5" style="fill:var(--fg)"/>`,
  },
  letterA: {
    name: "C 字母 a", note: "agenthop 的 a：<br>顶上那一钩换成一跳，从这边落到那边",
    svg: (id) => `<defs>${grad(id, 'x1="0" y1="0" x2="1" y2="0"')}</defs>
      <path d="M43.5 30 C43.5 15, 22 11.5, 17 22" fill="none" stroke="url(#g${id})" stroke-width="10" stroke-linecap="round"/>
      <circle cx="28.5" cy="43" r="9.3" fill="none" stroke-width="10" style="stroke:var(--fg)"/>
      <rect x="38.5" y="25" width="10" height="33" rx="5" style="fill:var(--fg)"/>`,
  },
  lowerH: {
    name: "D 小写 h", note: "hop 的 h：竖笔是这边，<br>弯过去的肩就是那一跳",
    svg: (id) => `<defs>${grad(id)}</defs>
      <path d="M22 34 C22 21, 44 19.5, 44 33 V49.5" fill="none" stroke="url(#g${id})" stroke-width="11" stroke-linecap="round"/>
      <path d="M20 12 V49.5" fill="none" stroke-width="11" stroke-linecap="round" style="stroke:var(--fg)"/>`,
  },
  rabbit: {
    name: "E 跃兔", note: "hop 就是兔子跳；<br>两只耳朵是两个 agent，也像两根天线",
    svg: (id) => `<ellipse cx="24.5" cy="21" rx="5.6" ry="15" transform="rotate(-11 24.5 34)" style="fill:var(--a)"/>
      <ellipse cx="39.5" cy="21" rx="5.6" ry="15" transform="rotate(11 39.5 34)" style="fill:var(--b)"/>
      <ellipse cx="32" cy="45" rx="17" ry="13.5" style="fill:var(--fg)"/>
      <circle cx="26" cy="44" r="2.2" style="fill:var(--bg)"/><circle cx="38" cy="44" r="2.2" style="fill:var(--bg)"/>`,
  },
};
const mark = (k, size) => `<svg width="${size}" height="${size}" viewBox="0 0 64 64">${MARKS[k].svg(++uid)}</svg>`;
const lockup = (k, size, word) => `<div style="display:flex;align-items:center;gap:${Math.round(size * 0.22)}px">${mark(k, size)}<span class="word" style="font-size:${Math.round(size * 0.78)}px">${word}</span></div>`;
let html = "";
for (const k of Object.keys(MARKS)) {
  html += `<div class="row">
    <div class="name"><b>${MARKS[k].name}</b><span>${MARKS[k].note}</span></div>
    <div class="cell dark"><div class="tile">${mark(k, 96)}</div></div>
    <div class="cell dark">${lockup(k, 70, "agenthop")}</div>
    <div class="cell light">${lockup(k, 70, "agenthop")}</div>
    <div class="cell small dark">${mark(k, 48)}${mark(k, 32)}${mark(k, 20)}<span style="width:100%;height:0"></span><span class="light" style="display:flex;gap:14px;background:var(--bg);border-radius:10px;padding:8px 12px">${mark(k, 32)}${mark(k, 20)}${mark(k, 16)}</span></div>
  </div>`;
}
document.getElementById("rows").innerHTML = html;
document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body>
</html>
