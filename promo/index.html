:root{
  --sans:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --display:"SF Pro Display","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --brand:"Manrope","SF Pro Display",system-ui,sans-serif;
  --mono:"JetBrainsMono Nerd Font","JetBrainsMonoNL Nerd Font","JetBrains Mono","SF Mono",Menlo,"PingFang SC","Noto Sans SC",monospace;
  /* Every other colour comes from the palette (PALETTES in the script), set here at start-up. */
  --line:color-mix(in srgb,var(--veil) 10%,transparent);
  --line2:color-mix(in srgb,var(--veil) 19%,transparent);
  --tint:color-mix(in srgb,var(--veil) 5%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--text);transform-origin:0 0;-webkit-font-smoothing:antialiased}
.abs{position:absolute;left:0;top:0}
.full{position:absolute;inset:0}
.layer{position:absolute;inset:0;pointer-events:none}
svg.i{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.glowc{box-shadow:0 0 var(--gr,50px) color-mix(in srgb,var(--gc) calc(var(--ga,25%) * var(--glow)),transparent)}

/* background */
.glow{position:absolute;width:1500px;height:1500px;left:0;top:0;border-radius:50%}
.dots{position:absolute;inset:-64px;background-image:radial-gradient(color-mix(in srgb,var(--veil) var(--dots),transparent) 1.3px,transparent 1.5px);background-size:40px 40px}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,var(--vig) 100%)}
#grain{position:absolute;inset:0;opacity:var(--grain);mix-blend-mode:overlay;background-size:480px 270px}

/* windows */
.win{position:absolute;width:700px;height:560px;border-radius:20px;background:linear-gradient(180deg,var(--surf1),var(--surf2));border:1px solid var(--line);box-shadow:0 40px 90px var(--shade);overflow:hidden}
.win .bar{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--tint)}
.win .dots3{display:flex;gap:8px}.win .dots3 i{width:12px;height:12px;border-radius:50%;background:var(--line2);display:block}
.win .title{font:600 23px var(--display);letter-spacing:.2px;color:var(--text)}
.win .host{font:500 18px var(--sans);color:var(--muted)}
.win .status{margin-left:auto;font:500 17px var(--sans);display:flex;align-items:center;gap:9px}
.win .status b{width:10px;height:10px;border-radius:50%;display:block}
.win .body{position:absolute;left:0;right:0;top:56px;bottom:0;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px);mask-image:linear-gradient(to bottom,transparent 0,#000 26px)}
.page{position:absolute;left:28px;right:28px;top:22px}
.ln{overflow:hidden;white-space:pre-wrap;word-break:break-all}
.ln.t{font:20px/1.62 var(--mono);color:var(--text2)}
.ln .pfx,.ln .fn,.ln .code{color:var(--a)} .ln .code{font-weight:700}
.win.R .ln .pfx,.win.R .ln .fn{color:var(--b)}
.ln .p{color:var(--muted)} .ln .str{color:var(--str)}
.ln .r{color:color-mix(in srgb,var(--text2) 70%,var(--muted))} .ln .w{color:var(--text)} .ln .who{color:var(--b)} .ln .whoa{color:var(--warn)} .ln .ok{color:var(--ok)}
.win.R .ln .who{color:var(--a)}
.caret{display:inline-block;width:.56em;height:1.08em;background:var(--a);vertical-align:-.18em;margin-left:2px;border-radius:2px}
.win.R .caret{background:var(--b)}

/* center actors */
.center{position:absolute;left:960px;top:var(--midy);width:0;height:0}
.relay .ring{position:absolute;left:-64px;top:-64px;width:128px;height:128px;border-radius:50%;border:2px solid color-mix(in srgb,var(--hop) 55%,transparent)}
.relay .disc{position:absolute;left:-64px;top:-64px;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--hop) 20%,var(--bg)),color-mix(in srgb,var(--hop) 6%,var(--bg)) 70%);border:1.5px solid color-mix(in srgb,var(--hop) 45%,transparent);--gc:var(--hop);--gr:60px;--ga:22%;display:grid;place-items:center;color:var(--hop)}
.relay .lbl{position:absolute;left:-150px;width:300px;top:80px;text-align:center;font:600 28px var(--sans);color:var(--text)}
.relay .sub{position:absolute;left:-150px;width:300px;top:122px;text-align:center;font:400 19px var(--sans);color:var(--muted)}
.relay .seen{position:absolute;left:-142px;width:284px;top:-196px;height:104px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--hop) 40%,transparent);background:color-mix(in srgb,var(--bg) 75%,transparent);text-align:center;padding-top:14px}
.relay .seen .h{font:500 17px var(--sans);color:var(--muted)}
.relay .seen .x{font:700 21px/1.4 var(--mono);color:var(--hop);margin-top:8px;letter-spacing:.5px}
#link{position:absolute;left:0;top:0;overflow:visible}

/* packets */
.pk{position:absolute;left:0;top:0;display:flex;align-items:center;gap:10px;white-space:nowrap;will-change:transform}
.pk.cipher{padding:11px 18px;border-radius:999px;background:color-mix(in srgb,var(--hop) 15%,var(--bg));border:1.5px solid color-mix(in srgb,var(--hop) 70%,transparent);color:var(--hop);font:700 19px var(--mono);--gc:var(--hop);--gr:34px;--ga:35%}
.pk.file{padding:14px 18px;border-radius:16px;background:var(--surf1);border:1.5px solid color-mix(in srgb,var(--b) 75%,transparent);color:var(--text);font:600 20px var(--sans);--gc:var(--b);--gr:40px;--ga:35%;gap:14px}
.pk.file small{display:block;font:500 16px var(--mono);color:var(--b);margin-top:4px}
.pk.env{padding:14px 20px;border-radius:16px;background:var(--surf1);border:1.5px solid color-mix(in srgb,var(--hop) 75%,transparent);color:var(--text);font:600 20px var(--sans);--gc:var(--hop);--gr:44px;--ga:35%;gap:14px}
.pk.env small{display:block;font:500 16px var(--sans);color:var(--hop);margin-top:4px}

/* text */
.cap{position:absolute;left:0;width:1920px;top:var(--capy);text-align:center;font:500 38px/1.3 var(--sans);color:var(--text);letter-spacing:.6px;text-shadow:0 2px 24px var(--capshade)}
.cap em{font-style:normal;color:var(--hop)}
.h1{position:absolute;left:0;width:1920px;text-align:center;font-weight:700;letter-spacing:1px}
.grad2{background:linear-gradient(95deg in oklab,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gradw{background:linear-gradient(95deg in oklab,var(--w1) 0%,var(--w2) 45%,var(--w3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;border:1.5px solid var(--line2);background:var(--tint);font:500 30px var(--sans);color:var(--text2)}
.chip svg{color:var(--hop)}

/* title */
.word{font:700 150px/1.34 var(--brand);letter-spacing:-4.5px;color:var(--text)}

/* code anatomy */
.bigcode{position:absolute;left:0;top:0;white-space:nowrap;font:700 52px/1 var(--mono);letter-spacing:.5px}
.bigcode span{display:inline-block}.bigcode .a{color:var(--text)}.bigcode .d{color:var(--faint)}.bigcode .s{color:var(--hop)}
.anat{position:absolute;text-align:center}
.anat .k{font:700 40px var(--sans);display:flex;gap:12px;align-items:center;justify-content:center}
.anat .v{font:400 28px var(--sans);color:var(--muted);margin-top:10px}

/* the steps of a conversation */
.stepper{display:flex;align-items:center;justify-content:center;gap:10px}
.stepper .st{display:inline-flex;align-items:center;gap:10px;padding:9px 20px 9px 10px;border-radius:999px;font:600 24px var(--sans);color:var(--faint);border:1.5px solid var(--line);background:var(--tint);white-space:nowrap}
.stepper .st b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--display);background:var(--line);color:var(--muted)}
.stepper .st.done{color:var(--muted)} .stepper .st.done b{background:color-mix(in srgb,var(--ok) 18%,var(--bg));color:var(--ok)}
.stepper .st.now{color:var(--on-hop);background:var(--hop);border-color:var(--hop)} .stepper .st.now b{background:color-mix(in srgb,var(--on-hop) 22%,transparent);color:var(--on-hop)}
.stepper .sa{width:22px;height:2px;background:var(--line2);display:block}
.h1 code{font:600 30px var(--mono);color:var(--hop)}

/* invite card */
.card{position:absolute;border-radius:22px;background:linear-gradient(180deg,var(--surf1),var(--surf2));border:1px solid var(--line);box-shadow:0 40px 90px var(--shade)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:62px;border-radius:14px;font:600 26px var(--sans);padding:0 34px}
.btn.pri{background:var(--hop);color:var(--on-hop)}
.btn.sec{border:1.5px solid var(--line2);color:var(--text2)}

/* integrate */
.term{position:absolute;left:390px;width:1140px;height:170px;border-radius:20px;background:var(--surf2);border:1px solid var(--line);box-shadow:0 30px 70px var(--shade);padding:34px 40px;font:600 30px/1.6 var(--mono)}
.fact{position:absolute;display:flex;align-items:center;gap:14px;font:500 30px var(--sans);color:var(--text2);white-space:nowrap}
.fact svg{color:var(--hop)}

/* opening */
.head{font:700 64px/1.3 var(--sans);letter-spacing:3px;color:var(--text)}
.node{position:absolute;left:0;top:0;width:240px;text-align:center}
.node .av{width:104px;height:104px;margin:0 auto}
.node .nl{margin-top:12px;font:600 26px var(--sans);color:var(--text);white-space:nowrap}
.rb{text-wrap:balance;position:absolute;left:0;top:0;max-width:400px;padding:12px 20px;border-radius:18px;background:var(--surf1);border:1.5px solid var(--line2);box-shadow:0 12px 30px var(--shade);font:500 25px/1.45 var(--sans);color:var(--text)}
.rb.L{border-bottom-left-radius:6px}.rb.R{border-bottom-right-radius:6px}
.rb.you{background:color-mix(in srgb,var(--you) 14%,var(--bg));border-color:color-mix(in srgb,var(--you) 50%,transparent)}
.chatw{position:absolute;border-radius:24px;background:linear-gradient(180deg,var(--surf1),var(--surf2));border:1px solid var(--line);box-shadow:0 30px 70px var(--shade);overflow:hidden}
.chatw .ch{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--tint);font:600 22px/1.2 var(--sans);color:var(--text)}
.chatw .ch small{font:500 16px var(--sans);color:var(--muted)}
.chatw .cb{position:absolute;left:0;right:0;top:64px;bottom:0;overflow:hidden}
.cm{position:absolute;left:0;top:0;max-width:430px}
.cm .bb{text-wrap:balance;padding:11px 18px;border-radius:18px;font:500 22px/1.45 var(--sans);color:var(--text);background:var(--bg);border:1.5px solid var(--line2)}
.cm.L .bb{border-bottom-left-radius:6px}.cm.R .bb{border-bottom-right-radius:6px}
.shot{width:370px;border-radius:16px;padding:12px 16px;font:500 20px/1.5 var(--sans);color:var(--text)}
.shot.A{background:color-mix(in srgb,var(--a) 12%,var(--bg));border:1.5px solid color-mix(in srgb,var(--a) 45%,transparent)}
.shot.B{background:color-mix(in srgb,var(--b) 12%,var(--bg));border:1.5px solid color-mix(in srgb,var(--b) 45%,transparent)}
.shot .sh{display:flex;align-items:center;gap:8px;font:600 16px var(--sans);margin-bottom:6px}
.shot.A .sh{color:var(--a)}.shot.B .sh{color:var(--b)}
.shot .sh i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.fcard{display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line2);font:600 21px/1.3 var(--sans);color:var(--text)}
.fcard small{display:block;font:500 15px var(--mono);color:var(--muted)}
.pair{display:inline-flex;align-items:center;gap:12px;padding:12px 16px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surf1);font:600 28px var(--sans);color:var(--text);white-space:nowrap;box-shadow:0 10px 24px var(--shade)}
.pair b{color:var(--hop);font-weight:700}
.pair .av{width:40px;height:40px;gap:3px;border-width:1.5px}
.rb.A{background:color-mix(in srgb,var(--a) 12%,var(--bg));border-color:color-mix(in srgb,var(--a) 45%,transparent)}
.rb.B{background:color-mix(in srgb,var(--b) 12%,var(--bg));border-color:color-mix(in srgb,var(--b) 45%,transparent)}
.me{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;color:var(--you);background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--you) 26%,var(--bg)),color-mix(in srgb,var(--you) 9%,var(--bg)));border:2px solid color-mix(in srgb,var(--you) 60%,transparent);--gc:var(--you);margin:0 auto}

/* the agent's face: three dots, the same ones as in the mark */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;gap:9px;border:2px solid}
.av i{width:13px;height:13px;border-radius:50%;background:currentColor;display:block}
.av.L{color:var(--a);border-color:color-mix(in srgb,var(--a) 60%,transparent);background:color-mix(in srgb,var(--a) 11%,var(--bg))}
.av.R{color:var(--b);border-color:color-mix(in srgb,var(--b) 60%,transparent);background:color-mix(in srgb,var(--b) 11%,var(--bg))}

/* scenes */
.agent{position:absolute;width:340px;border-radius:24px;padding:26px 22px 28px;background:linear-gradient(180deg,var(--surf1),var(--surf2));border:1px solid var(--line);box-shadow:0 30px 70px var(--shade);text-align:center}
.agent .av{width:104px;height:104px;margin:0 auto}
.agent .nm{font:700 30px var(--sans);color:var(--text);margin-top:16px}
.agent .kn{font:500 20px var(--sans);color:var(--muted);margin:18px 0 6px}
.agent .kt{display:inline-block;margin:8px 4px 0;padding:8px 14px;border-radius:12px;font:500 22px var(--sans);color:var(--text2);background:var(--tint);border:1px solid var(--line)}
.brow{position:relative;display:flex}
.brow.L{justify-content:flex-start}.brow.R{justify-content:flex-end}
.bub{max-width:900px;padding:17px 26px;border-radius:26px;font:500 27px/1.45 var(--sans);color:var(--text)}
.brow.L .bub{background:color-mix(in srgb,var(--a) 13%,var(--bg));border:1.5px solid color-mix(in srgb,var(--a) 45%,transparent);border-bottom-left-radius:8px}
.brow.R .bub{background:color-mix(in srgb,var(--b) 13%,var(--bg));border:1.5px solid color-mix(in srgb,var(--b) 45%,transparent);border-bottom-right-radius:8px}
.typing{position:absolute;top:0;display:flex;gap:9px;padding:21px 24px;border-radius:26px;background:var(--tint);border:1px solid var(--line2)}
.brow.L .typing{left:0}.brow.R .typing{right:0}
.typing i{width:11px;height:11px;border-radius:50%;background:var(--muted);display:block}
.result{position:absolute;left:0;display:flex;align-items:center;gap:22px;padding:22px 32px;border-radius:22px;background:color-mix(in srgb,var(--hop) 10%,var(--bg));border:1.5px solid color-mix(in srgb,var(--hop) 55%,transparent);--gc:var(--hop);--ga:18%}
.result .rc{width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--hop);color:var(--on-hop)}
.result .rl{font:600 20px var(--sans);color:var(--hop);letter-spacing:1px}
.result .rt{font:600 30px var(--sans);color:var(--text);margin-top:6px;white-space:nowrap}
.result .ra{color:var(--hop);margin:0 16px}

/* the English cut (?lang=en): a Latin face, no tracking on Latin text, words kept whole */
#stage.en{--sans:system-ui,-apple-system,"Helvetica Neue","PingFang SC",sans-serif;--display:system-ui,-apple-system,"Helvetica Neue",sans-serif}
#stage.en .h1,#stage.en .head,#stage.en .schead{letter-spacing:-.01em!important}
#stage.en .cap,#stage.en .chip,#stage.en .fact,#stage.en .result .rl,#stage.en .node .nl{letter-spacing:0!important}
#stage.en .ln{word-break:normal;overflow-wrap:anywhere}
#stage.en .rb{font-size:23px}
#stage.en .bub{font-size:25px}
#stage.en .result .rt{font-size:28px}

/* preview controls */
#ctl[hidden]{display:none}
#ctl{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(transparent,rgba(0,0,0,.85));font:14px var(--mono);color:#cfd6e2;z-index:10}
#ctl button{background:#1c2331;color:#e8edf5;border:1px solid #2f3a4f;border-radius:8px;height:34px;min-width:44px;font:600 15px var(--sans);cursor:pointer}
#ctl input{flex:1}
</style>
</head>

const instFacts = h("div", "abs", null, inst, { left: "0", width: "1920px", top: "866px", display: "flex", justifyContent: "center", gap: "84px" });
const INST_FACTS = [["plug", T("支持 MCP 的 Agent 都能接", "Works with any agent that speaks MCP")], ["monitor", "macOS · Linux · Windows"], ["box", T("一个文件，不用装 Node.js", "One file, no Node.js needed")]].map(([i, text]) => h("div", "fact", `${ico(i, 32)}${text}`, instFacts, { position: "relative" }));
INST_AGENTS.forEach((_, i) => cue(IT + 4.4 + i * 0.16, "pop"));
INST_FACTS.forEach((_, i) => cue(IT + 5.4 + i * 0.3, "pop"));
cue(IT + 0.05, "hit", { soft: 1 });
NOW.push((t) => {
  const on = t > IT - 0.1 && t < IT + 10;
  show(inst, on);
  if (!on) return;
  const out = E.in(prog(t, IT + 9.2, IT + 9.9));
  tf(instH, { o: vis(t, IT, IT + 11, 0.45, 0) * (1 - out), y: kf(t, [[IT, -24], [IT + 0.5, 0, E.out]]) - 20 * out });
  tf(instT, { o: vis(t, IT + 0.3, IT + 11, 0.4, 0) * (1 - out), y: kf(t, [[IT + 0.3, 24], [IT + 0.8, 0, E.out]]) });
  let html = "";
  for (const ln of INST) {
    if (t < ln.at) break;
    if (ln.cls === "c") html += `<div style="color:var(--faint)">${ln.text}</div>`;
    else if (ln.cls === "$") {
      const n = Math.floor(ln.text.length * clamp((t - ln.at) / ln.dur)), typing = t < ln.at + ln.dur + 0.2;
      html += `<div><span style="color:var(--hop)">$ </span><span style="color:var(--text)">${ln.text.slice(0, n)}</span>${typing && Math.floor(t * 3.2) % 2 === 0 ? '<span class="caret"></span>' : ""}</div>`;
    } else if (ln.cls === "o") html += `<div style="color:var(--muted);font-weight:500">${ln.text}</div>`;
    else html += `<div style="color:var(--ok);font-weight:500">${ico("check", 26, 'style="display:inline;vertical-align:-4px;margin-right:10px"')}${ln.text}</div>`;
  }
  if (instT._html !== html) { instT.innerHTML = html; instT._html = html; }
  INST_AGENTS.forEach((c, i) => tf(c, { o: vis(t, IT + 4.4 + i * 0.16, IT + 11, 0.35, 0) * (1 - out), y: kf(t, [[IT + 4.4 + i * 0.16, 22], [IT + 4.9 + i * 0.16, 0, E.back]]) }));
  INST_FACTS.forEach((f, i) => tf(f, { o: vis(t, IT + 5.4 + i * 0.3, IT + 11, 0.4, 0) * (1 - out), y: kf(t, [[IT + 5.4 + i * 0.3, 16], [IT + 5.9 + i * 0.3, 0, E.out]]) }));
});

// A fade to black at the very end. There is none at the start: the first frame is the question.
const black = h("div", "full", null, stage, { background: "#000" });
NOW.push((t) => { const o = E.in(prog(t, DUR - 1.8, DUR)); black.style.opacity = o.toFixed(3); show(black, o > 0.001); });

// ============================================================================================
// seek, init, preview.
// ============================================================================================
function seek(t) {
  const old = toOld(t);
  for (const f of UPD) f(old);
  for (const f of NOW) f(t);
}
window.seek = seek;
window.__cues = CUES.sort((a, b) => a.t - b.t);
window.__meta = { DUR, BPM, W, H, lang: T("zh", "en"), palette: PAL_ID, palettes: Object.fromEntries(Object.entries(PALETTES).map(([id, p]) => [id, { name: p.name, note: p.note, bg: p.bg, text: p.text, a: p.a, b: p.b, hop: p.hop, you: p.you, g: p.g }])) };

// The cover: the film's line in large type over the same background, 16:9 or 3:4 (?cover=16x9 / 3x4).
const COVER = new URLSearchParams(location.search).get("cover");
function buildCover(kind) {
  const tall = kind === "3x4";
  stage.style.width = `${tall ? 1080 : W}px`; stage.style.height = `${tall ? 1440 : H}px`;
  seek(26);
  for (const el of [...stage.children]) if (el !== bg) el.style.display = "none";
  const c = h("div", "full", null, stage, { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" });
  if (tall) h("div", null, markSVG(176), c, { marginBottom: "70px" });
  h("div", null, tall ? "你问你的 AI，<br>我问我的 AI，" : "你问你的 AI，我问我的 AI，", c, { font: `500 ${tall ? 56 : 60}px/1.35 var(--sans)`, letterSpacing: "3px", color: "var(--muted)", marginBottom: "18px" });
  h("div", null, tall ? '别再来回<br><span class="grad2">传话</span>了' : '别再来回<span class="grad2">传话</span>了', c, { font: `800 ${tall ? 132 : 140}px/1.22 var(--sans)`, letterSpacing: "4px", color: "var(--text)" });
  h("div", null, `${tall ? "" : markSVG(84, 6)}<span class="word" style="font-size:${tall ? 84 : 68}px;letter-spacing:-2px">AgentHop</span>`, c, { display: "flex", alignItems: "center", gap: "18px", marginTop: tall ? "80px" : "64px" });
  h("div", null, "让你的 Agent 和对方的 Agent 直接对话", c, { font: `500 ${tall ? 40 : 38}px var(--sans)`, color: "var(--muted)", letterSpacing: "2px", marginTop: "14px" });
  for (const m of c.querySelectorAll(".mark")) setMark(m, 99, 0, false);
}

async function init() {
  if (document.fonts) {
    await Promise.all([document.fonts.load('700 150px "Manrope"'), document.fonts.ready]);
    window.__brandFont = document.fonts.check('700 150px "Manrope"');
  }
  measurePages();
  for (const p of PK) { show(p.el, true); p.el.style.transform = "none"; p.w = p.el.offsetWidth; p.hh = p.el.offsetHeight; show(p.el, false); }
  if (COVER) { buildCover(COVER); window.__ready = true; return; }
  // ?measure: content only, on black — for checking where the weight of each frame sits.
  if (new URLSearchParams(location.search).has("measure")) { bg.style.display = "none"; stage.style.background = "#000"; }
  seek(0);
  window.__ready = true;
  if (!RENDER) preview();
}
function preview() {
  const vp = document.getElementById("viewport"), ctl = document.getElementById("ctl"), btn = document.getElementById("play"), tm = document.getElementById("tm"), scrub = document.getElementById("scrub");
  ctl.hidden = false;
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 56) / H); stage.style.transform = `scale(${s})`; stage.style.left = `${(innerWidth - W * s) / 2}px`; stage.style.top = `${(innerHeight - 56 - H * s) / 2}px`; };
  fit(); addEventListener("resize", fit);
  scrub.max = DUR;
  const audio = new Audio(T("out/music.wav", "out/en/music.wav"));
  let playing = false, t0 = 0, start = 0;
  const now = () => (playing ? start + (performance.now() - t0) / 1000 : start);
  const setT = (t) => { start = clamp(t, 0, DUR); t0 = performance.now(); if (playing) { audio.currentTime = start; } seek(start); };
  btn.onclick = () => { start = now(); t0 = performance.now(); playing = !playing; btn.textContent = playing ? "❚❚" : "▶"; if (playing) { audio.currentTime = start; audio.play().catch(() => {}); } else { audio.pause(); } };
  scrub.oninput = () => setT(+scrub.value);
  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); btn.click(); } if (e.code === "ArrowRight") setT(now() + 2.5); if (e.code === "ArrowLeft") setT(now() - 2.5); });
  const q = new URLSearchParams(location.search).get("t"); if (q) setT(+q);
  (function loop() { const t = now(); if (playing && t >= DUR) { playing = false; btn.textContent = "▶"; audio.pause(); start = DUR; } if (playing) seek(t); tm.textContent = t.toFixed(2); scrub.value = t; requestAnimationFrame(loop); })();
}
init();
</script>
</body>
</html>
