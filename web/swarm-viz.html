      ${rec || `<div class="empty-note">No tool calls in the recent transcript window.</div>`}
      ${cost}`;
  }

  function fmtNum(n) { return (n ?? 0).toLocaleString(); }

  function boxDrawer(b) {
    const c = b.control;
    const cd = countdown(b.deadlineEpoch);
    const src = { record: "control record", "alloc-ts": "local alloc-ts + 1h", none: "unknown" }[b.deadlineSource];
    const flows = (state.flows ?? []).filter((f) => f.from.includes(b.shortId) || f.to.includes(b.shortId));
    return `
      <div class="close">✕</div>
      <h3>${esc(b.launchId)}</h3>
      <div class="kind">railway box · ${c ? esc(c.state) : "no control record yet"}</div>
      <div class="bar"><i style="width:100%;background:${cd.cls === "dead" ? "var(--expired)" : cd.cls === "warn" ? "var(--warn)" : "var(--idle)"}"></i></div>
      <dl>
        <dt>window</dt><dd class="${cd.cls}">${esc(cd.text)}</dd>
        <dt>deadline</dt><dd>${b.deadlineEpoch ? new Date(b.deadlineEpoch * 1000).toLocaleString() : "—"}</dd>
        <dt>source</dt><dd>${esc(src)}</dd>
        ${b.allocStart ? `<dt>allocated</dt><dd>${new Date(b.allocStart * 1000).toLocaleString()}</dd>` : ""}
        ${b.generation != null ? `<dt>generation</dt><dd>${b.generation}</dd>` : ""}
        ${b.repo ? `<dt>repo</dt><dd>${esc(b.repo)}</dd>` : ""}
        ${b.branch ? `<dt>branch</dt><dd>${esc(b.branch)}</dd>` : ""}
        ${b.sha ? `<dt>checkpoint</dt><dd>${esc(b.sha)}</dd>` : ""}
        ${b.handoffSha ? `<dt>handoff sha</dt><dd>${esc(b.handoffSha)}</dd>` : ""}
        ${b.attemptCount != null ? `<dt>attempts</dt><dd>${b.attemptCount}</dd>` : ""}
        ${c && c.owner ? `<dt>owner</dt><dd>${esc(c.owner)}</dd>` : ""}
        ${c && c.updatedAt ? `<dt>updated</dt><dd>${ago(c.updatedAt * 1000)}</dd>` : ""}
      </dl>
      ${b.allocExhausted ? `<div class="recover">Allocation attempts exhausted (${b.attemptCount ?? "?"} of the cap) — this launch is stuck and needs a human. Derived from attemptCount, not a field in the record.</div>` : ""}
      ${b.recoverable ? `<div class="recover">VM expired, but this task is recoverable — the checkpoint sha above is still canonical, so a successor can resume from it.</div>` : ""}
      ${lineage(b)}
      ${flows.length ? `<div class="sec">message flow</div>${flows.map((f) => `<div class="flowrow"><span class="who">${esc(short(f.from))}</span><span class="arrow">→</span><span class="who">${esc(short(f.to))}</span><span class="v">${f.count}× · ${ago(f.lastTs)}</span></div>`).join("")}` : ""}
      ${c && c.manifest ? `<div class="sec">manifest</div><div class="note">${esc(c.manifest)}</div>` : ""}
      ${!c ? `<div class="note">No <code>~/.agenthop/swarm/control/${esc(b.launchId)}.json</code> yet — showing the local allocation window only. Lifecycle state appears here once the dispatcher writes it.</div>` : ""}
    `;
  }

  /** The generation timeline: this launch and its predecessor/successor chain. Built from the control
   *  mirror we already read — no new data source. */
  function lineage(b) {
    const byId = new Map((state.boxes ?? []).map((x) => [x.launchId, x]));
    // Walk backwards to the root through any record that names this launch as its successor.
    const chain = [b];
    let cur = b;
    for (let i = 0; i < 12; i++) {
      const parent = [...byId.values()].find((x) => x.control?.successor === cur.launchId);
      if (!parent) break;
      chain.unshift(parent);
      cur = parent;
    }
    // Then forwards through successors.
    cur = b;
    for (let i = 0; i < 12; i++) {
      const nextId = cur.control?.successor;
      const next = nextId ? byId.get(nextId) : null;
      // A successor that names no existing record is a DANGLING link (the contract's samples have some).
      // Render it as explicitly missing rather than as a record-less row, so a broken chain reads as broken.
      if (!next) { if (nextId) chain.push({ launchId: nextId, control: null, sha: null, generation: null, shortId: nextId, dangling: true }); break; }
      chain.push(next);
      cur = next;
    }
    if (chain.length <= 1) return "";
    return `<div class="sec">lineage · generation chain</div><div class="tl">${
      chain.map((x) => `<div class="tl-item${x.launchId === b.launchId ? "" : " muted"}">
        <div>${esc(x.launchId)}${x.generation != null ? ` <span class="when">gen ${x.generation}</span>` : ""}</div>
        <div class="when">${x.dangling ? "<span style=\"color:var(--blocked)\">record missing (dangling successor)</span>" : x.control ? esc(x.control.state) : "no record"}${x.sha ? ` · ${esc(String(x.sha).slice(0, 10))}` : ""}</div>
      </div>`).join("")
    }</div>`;
  }

  // ---------------------------------------------------------------- helpers
  function el(tag, attrs) {
    const n = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function curve(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 40;
    return `M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}`;
  }
  function initials(tool) { return (tool || "?").slice(0, 2).toUpperCase(); }
  function clip(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function dur(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + "h " + m + "m";
    if (m > 0) return m + "m " + s + "s";
    return s + "s";
  }
  function ago(ms) {
    if (ms == null) return "—";
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    return s < 60 ? s + "s ago" : Math.floor(s / 60) + "m " + (s % 60) + "s ago";
  }
  function staleLabel(d) {
    const t = ago(d.statusAt);
    return d.via === "relay" && Date.now() - d.statusAt > 60000 ? t + " (stale)" : t;
  }
  function countdown(epochSec) {
    if (epochSec == null) return { text: "—", cls: "" };
    const left = Math.round(epochSec - Date.now() / 1000);
    if (left <= 0) return { text: "expired " + dur(-left) + " ago", cls: "dead" };
    return { text: dur(left) + " left", cls: left < 300 ? "warn" : "" };
  }

  // ---------------------------------------------------------------- header
  function renderJobsHeader() {
    const job = currentJob();
    if (!job) return;
    const jobs = state.projection.jobs;
    const b = job.budget || {};
    const bud = b.jobBudget || {}, used = b.used || {};
    const nodes = job.plan.nodes;
    const done = nodes.filter((n) => job.attempts[n.nodeId]?.current?.complete).length;
    const stale = nodes.filter((n) => { const a = job.attempts[n.nodeId]?.current; return a && a.status === "SUCCEEDED" && a.complete === false; }).length;
    const pct = (u, m) => (m ? Math.min(100, Math.round((u / m) * 100)) : 0);
    const statusColor = { running: "var(--working)", succeeded: "var(--idle)", failed: "var(--blocked)", blocked: "var(--warn)" }[job.plan.jobStatus] || "var(--dim)";
    const jobPick = jobs.length > 1
      ? `<select id="jobpick" class="search" style="width:auto;padding:4px 8px">${jobs.map((j) => `<option value="${esc(j.plan.jobId)}"${j.plan.jobId === job.plan.jobId ? " selected" : ""}>${esc(j.plan.jobId)}</option>`).join("")}</select>`
      : `<b>${esc(job.plan.jobId)}</b>`;
    $("stats").innerHTML =
      `<span>${jobPick}</span>` +
      `<span style="color:${statusColor}">● ${esc(job.plan.jobStatus)}</span>` +
      `<span><b>${done}/${nodes.length}</b> complete</span>` +
      (stale ? `<span style="color:var(--warn)"><b>${stale}</b> stale</span>` : "") +
      `<span>attempts <b>${used.totalAttempts ?? 0}</b>/${bud.maxTotalAttempts ?? "?"}</span>` +
      `<span>wall <b>${Math.round((used.wallClockSec ?? 0) / 60)}</b>/${bud.maxWallClockSec ? Math.round(bud.maxWallClockSec / 60) : "?"}m</span>` +
      (bud.maxModelUsd != null || used.modelUsd != null ? `<span>$<b>${(used.modelUsd ?? 0).toFixed(2)}</b></span>` : `<span class="muted">$ n/a</span>`) +
      ((job.results?.candidates?.length || job.results?.peerLate) ? `<span class="muted">cand ${job.results.candidates?.length || 0} · peerLate ${job.results.peerLate || 0}</span>` : "") +
      (job.plan.jobStatusNote ? `<span class="muted">${esc(job.plan.jobStatusNote)}</span>` : "");
    const jp = document.getElementById("jobpick");
    if (jp) jp.onchange = (e) => { selJob = e.target.value; jobSel = null; didFit = false; render(); };
  }

  function renderHeader() {
    const s = state;
    // Toggle is only meaningful once a projection exists; dim it otherwise.
    const hasProj = !!(s.projection && s.projection.present && (s.projection.jobs || []).length);
    const vt = $("viewtoggle");
    if (vt) { vt.style.display = hasProj ? "" : "none"; if (!hasProj && viewMode === "jobs") { viewMode = "topology"; } }
    if (viewMode === "jobs" && hasProj) { renderJobsHeader(); return; }
    const byStatus = {};
    for (const n of s.nodes) byStatus[n.status ?? "unknown"] = (byStatus[n.status ?? "unknown"] ?? 0) + 1;
    const relayN = s.nodes.filter((n) => n.via === "relay").length;
    const live = s.boxes.filter((b) => b.deadlineEpoch && b.deadlineEpoch * 1000 > Date.now()).length;
    $("stats").innerHTML =
      `<span><b>${s.nodes.length}</b> sessions</span>` +
      `<span><b>${relayN}</b> remote</span>` +
      `<span><b>${s.boxes.length}</b> boxes</span>` +
      `<span><b>${live}</b> live boxes</span>` +
      `<span>${Object.entries(byStatus).map(([k, v]) => `<b style="color:${STATUS_COLOR[k]}">${v}</b> ${esc(k)}`).join(", ")}</span>` +
      `<span>snap ${ago(s.generatedAt)}</span>`;
    $("stale-info").textContent = `remote presence lags up to ${s.relayStaleMs / 1000}s`;
    for (const c of document.querySelectorAll(".chip")) {
      c.classList.toggle("on", filters.has(c.dataset.f));
    }
  }

  // ---------------------------------------------------------------- events
  function wireFilters() {
    const defs = [["working", "working"], ["idle", "idle"], ["blocked", "blocked"], ["relay", "remote"], ["box", "boxes"]];
    const box = $("filters");
    for (const [k, label] of defs) {
      const b = document.createElement("button");
      b.className = "chip"; b.dataset.f = k; b.textContent = label;
      b.onclick = () => { filters.has(k) ? filters.delete(k) : filters.add(k); render(); renderHeader(); };
      box.appendChild(b);
    }
  }

  const svg = $("svg");
  let userMoved = false;
  window.addEventListener("resize", () => { if (!userMoved) fit(); });
  let drag = null;
  svg.addEventListener("mousedown", (e) => {
    if (e.target.closest(".node")) return;
    userMoved = true;
    drag = { x: e.clientX - view.x, y: e.clientY - view.y };
    svg.classList.add("grabbing");
  });
  window.addEventListener("mousemove", (e) => {
    if (!drag) return;
    view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; draw();
  });
  window.addEventListener("mouseup", () => { drag = null; svg.classList.remove("grabbing"); });
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    userMoved = true;
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const k2 = Math.min(2.6, Math.max(0.3, view.k * (e.deltaY < 0 ? 1.1 : 0.9)));
    view.x = mx - ((mx - view.x) / view.k) * k2;
    view.y = my - ((my - view.y) / view.k) * k2;
    view.k = k2; draw();
  }, { passive: false });
  svg.addEventListener("click", () => { if (sel) { sel = null; render(); } });

  $("search").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); render(); });

  // Keyboard: Esc clears the selection, / focuses search. Both keep the hands on the keyboard during a
  // long watch session, which is the main way this page is actually used.
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (sel || pair) { sel = null; pair = null; render(); }
      else if (query) { $("search").value = ""; query = ""; render(); }
    } else if (e.key === "/" && document.activeElement !== $("search")) {
      e.preventDefault();
      $("search").focus();
    }
  });

  // ---------------------------------------------------------------- poll + local clock tick
  async function tick() {
    try {
      const r = await fetch("/state.json", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      state = await r.json();
      render(); renderHeader();
    } catch (e) {
      $("stats").innerHTML = `<span class="offline">exporter unreachable: ${esc(e.message)}</span>`;
    }
  }

  wireFilters();
  $("tcollapse").onclick = () => {
    const t = $("ticker");
    t.classList.toggle("collapsed");
    $("tcollapse").textContent = t.classList.contains("collapsed") ? "\u25b8" : "\u25be";
  };
  $("rcollapse").onclick = () => {
    const r = $("river");
    r.classList.toggle("collapsed");
    const collapsed = r.classList.contains("collapsed");
    $("rcollapse").textContent = collapsed ? "\u25b8" : "\u25be";
    $("stage").classList.toggle("river-open", !collapsed);
    requestAnimationFrame(() => { if (model) fit(); });
  };
  // Theme persists across reloads; default follows the OS preference on first visit.
  (() => {
    const saved = localStorage.getItem("swarm-viz-theme");
    const initial = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", initial);
    $("theme").onclick = () => {
      const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("swarm-viz-theme", next);
    };
  })();
  $("viewtoggle").onclick = () => {
    viewMode = viewMode === "jobs" ? "topology" : "jobs";
    $("viewtoggle").textContent = viewMode === "jobs" ? "◂ topology" : "jobs ▸";
    didFit = false; // re-fit for the new axis
    jobSel = null; sel = null;
    render();
  };
  // Pause everything while the tab is hidden — timers keep firing in a background tab, so an
  // all-day-open page would otherwise animate and re-render for nobody.
  document.addEventListener("visibilitychange", () => {
    const hidden = document.visibilityState === "hidden";
    document.body.classList.toggle("hidden-tab", hidden);
    if (!hidden) tick(); // catch up immediately on return rather than waiting for the next interval
  });

  tick();
  setInterval(() => { if (document.visibilityState === "visible") tick(); }, 2000);
  // Re-render local clocks (countdown, ago) every second without a refetch.
  setInterval(() => {
    if (!state || document.visibilityState !== "visible") return;
    for (const it of (model?.items ?? [])) {
      if (it.kind !== "box") continue;
      const t = countdown(it.data.deadlineEpoch);
      const node = $("view").querySelector(`[transform="translate(${it.x},${it.y})"] .cd`);
      if (node) { node.textContent = t.text; node.setAttribute("class", "cd " + (t.cls ?? "")); }
    }
    renderHeader();
    if (sel) renderDrawer();
  }, 1000);
})();
</script>
</body>
</html>
